# Copier en inventory.ini (non versionné) et adapter.
# Sur une installation neuve de l'hôte, seule l'IP publique est joignable (pas encore de NetBird).
[proxmox]
ns3092722 ansible_host=54.36.121.105 ansible_user=root

# VMs : par leur nom NetBird une fois jointes ; avant cela, par leur IP vmbr1 en passant
# par l'hôte (décommenter ansible_ssh_common_args).
[grafana]
grafana ansible_host=grafana.netbird.cloud ansible_user=root

[ctfd]
ctf-rootmeup ansible_host=ctf-rootmeup.netbird.cloud ansible_user=jakub ansible_become=true

