- name: Recharger sshd
  ansible.builtin.service: { name: ssh, state: reloaded }

- name: Redémarrer mariadb
  ansible.builtin.service: { name: mariadb, state: restarted }

- name: Redémarrer ctfd
  ansible.builtin.systemd_service: { name: ctfd, state: restarted, daemon_reload: true }

- name: Recharger nginx
  ansible.builtin.service: { name: nginx, state: reloaded }

- name: Redémarrer docker
  ansible.builtin.service: { name: docker, state: restarted }

- name: Redémarrer node_exporter
  ansible.builtin.service: { name: prometheus-node-exporter, state: restarted }

- name: Recharger le pare-feu
  ansible.builtin.service: { name: netfilter-persistent, state: restarted }

- name: Recharger sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Redémarrer fail2ban
  ansible.builtin.service: { name: fail2ban, state: restarted }

- name: Recharger auditd
  ansible.builtin.command: augenrules --load
  changed_when: true
