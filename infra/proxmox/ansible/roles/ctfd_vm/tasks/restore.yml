# Restaure la base et les fichiers déposés produits par infra/vms/backup-data.sh.
- name: Arrêt de CTFd pendant la restauration
  ansible.builtin.service:
    name: ctfd
    state: stopped
  failed_when: false

- name: Copie du dump SQL
  ansible.builtin.copy:
    src: "{{ ctfd_restore_from }}/ctfd.sql.gz"
    dest: /root/ctfd.sql.gz
    mode: "0600"

- name: Import de la base ctfd
  ansible.builtin.shell: set -o pipefail && zcat /root/ctfd.sql.gz | mysql ctfd
  args:
    executable: /bin/bash
  changed_when: true

- name: Fichiers déposés (pièces jointes des challenges)
  ansible.builtin.unarchive:
    src: "{{ ctfd_restore_from }}/ctfd-uploads.tar.gz"
    dest: /var/lib/ctfd/
    owner: ctfd
    group: ctfd

- name: Dump supprimé de la VM
  ansible.builtin.file:
    path: /root/ctfd.sql.gz
    state: absent
