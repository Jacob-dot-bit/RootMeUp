# VM CTFd : CTFd (venv + gunicorn) derrière nginx en HTTPS, MariaDB, Redis, Docker pour
# les instances de challenges. Prérequis : Debian 13 installée (partitionnement LVM CIS) et
# comptes SSH des administrateurs ; NetBird est installé par le rôle netbird.

- name: Dépôt Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Source APT Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable

- name: Paquets
  ansible.builtin.apt:
    name:
      - nginx
      - mariadb-server
      - redis-server
      - git
      - python3-venv
      - python3-dev
      - build-essential
      - libffi-dev
      - python3-pymysql
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - prometheus-node-exporter
      - fail2ban
      - auditd
      - libpam-pwquality
      - iptables-persistent
      - lynis
      - acl
      - python3-docker
    state: present
    update_cache: true

# --- Comptes ----------------------------------------------------------------
- name: Compte de service ctfd (seul membre du groupe docker)
  ansible.builtin.user:
    name: ctfd
    system: true
    home: "{{ ctfd_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
    groups: docker
    append: true

- name: Compte tunnel (redirection MySQL pour Grafana, sans shell)
  ansible.builtin.user:
    name: tunnel
    system: true
    shell: /usr/sbin/nologin
    groups: _ssh
    append: true

- name: Clé autorisée du tunnel (redirection vers MariaDB uniquement)
  ansible.posix.authorized_key:
    user: tunnel
    key: "{{ tunnel_public_key }}"
    key_options: 'restrict,port-forwarding,permitopen="127.0.0.1:3306"'
  when: tunnel_public_key | length > 0

- name: Compte tunnel autorisé par sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-grafana-tunnel.conf
    content: "AllowUsers tunnel\n"
    mode: "0600"
  notify: Recharger sshd

# --- SSH --------------------------------------------------------------------
- name: sshd durci (clé uniquement, root interdit, liste blanche)
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger sshd

# --- Base de données et cache -------------------------------------------------
- name: MariaDB en loopback
  community.general.ini_file:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    section: mariadbd
    option: bind-address
    value: 127.0.0.1
    mode: "0644"
  notify: Redémarrer mariadb

- name: Base ctfd
  community.mysql.mysql_db:
    name: ctfd
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Utilisateur MariaDB ctfd
  community.mysql.mysql_user:
    name: ctfd
    host: localhost
    password: "{{ ctfd_db_password }}"
    priv: "ctfd.*:ALL"
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Redis actif
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true

# --- CTFd -------------------------------------------------------------------
- name: Dossier de CTFd
  ansible.builtin.file:
    path: "{{ ctfd_dir }}"
    state: directory
    owner: ctfd
    group: ctfd
    mode: "0750"

- name: Sources de CTFd
  ansible.builtin.git:
    repo: https://github.com/CTFd/CTFd.git
    dest: "{{ ctfd_dir }}"
    version: "{{ ctfd_version }}"
    # config.ini est modifié localement : on ne touche plus à un clone existant.
    # Pour changer de version : ctfd_update=true (après sauvegarde).
    update: "{{ ctfd_update | default(false) }}"
    force: false
  become_user: ctfd
  notify: Redémarrer ctfd

- name: Plugin CTFdDockerContainersPlugin
  ansible.builtin.git:
    repo: "{{ ctfd_plugin_repo }}"
    dest: "{{ ctfd_dir }}/CTFd/plugins/containers"
    version: "{{ ctfd_plugin_version }}"
    update: "{{ ctfd_update | default(false) }}"
  become_user: ctfd
  notify: Redémarrer ctfd

- name: venv Python de CTFd
  ansible.builtin.pip:
    requirements: "{{ ctfd_dir }}/requirements.txt"
    virtualenv: "{{ ctfd_dir }}/.venv"
    virtualenv_command: python3 -m venv
  become_user: ctfd

- name: Dépendances du plugin
  ansible.builtin.pip:
    requirements: "{{ ctfd_dir }}/CTFd/plugins/containers/requirements.txt"
    virtualenv: "{{ ctfd_dir }}/.venv"
  become_user: ctfd
  failed_when: false  # le plugin n'a pas toujours de requirements.txt

- name: Réglages de session dans config.ini
  community.general.ini_file:
    path: "{{ ctfd_dir }}/CTFd/config.ini"
    section: server
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    owner: ctfd
    group: ctfd
    mode: "0640"
  loop: "{{ {'SESSION_COOKIE_HTTPONLY': 'true', 'SESSION_COOKIE_SAMESITE': 'Lax', 'PERMANENT_SESSION_LIFETIME': '604800'} | dict2items }}"
  notify: Redémarrer ctfd

- name: Dossier de l'environnement CTFd
  ansible.builtin.file:
    path: /etc/ctfd
    state: directory
    mode: "0755"

- name: Environnement CTFd (clé secrète, BDD, Redis, proxy)
  ansible.builtin.template:
    src: ctfd.env.j2
    dest: /etc/ctfd/ctfd.env
    owner: root
    group: ctfd
    mode: "0640"
  no_log: true
  notify: Redémarrer ctfd

- name: Dossier des fichiers déposés
  ansible.builtin.file:
    path: /var/lib/ctfd/uploads
    state: directory
    owner: ctfd
    group: ctfd
    mode: "0755"

- name: Dossier des logs CTFd
  ansible.builtin.file:
    path: /var/log/ctfd
    state: directory
    owner: ctfd
    group: ctfd
    mode: "0750"

- name: Service ctfd (gunicorn sur 127.0.0.1:8000)
  ansible.builtin.template:
    src: ctfd.service.j2
    dest: /etc/systemd/system/ctfd.service
    mode: "0640"
  notify: Redémarrer ctfd

- name: Restauration des données CTFd
  ansible.builtin.include_tasks: restore.yml
  when: ctfd_restore_from | length > 0

# Au tout premier démarrage, la création du schéma peut échouer une fois
# (« Table definition has changed ») : on réessaie.
- name: CTFd actif au démarrage
  ansible.builtin.systemd_service:
    name: ctfd
    state: started
    enabled: true
    daemon_reload: true
  register: ctfd_start
  retries: 3
  delay: 10
  until: ctfd_start is succeeded

# --- nginx + HTTPS ------------------------------------------------------------
- name: Dossier des certificats
  ansible.builtin.file:
    path: /etc/nginx/certs
    state: directory
    mode: "0700"

- name: Certificat autosigné (NetBird ne délivre pas de certificat)
  ansible.builtin.command: >-
    openssl req -x509 -nodes -newkey rsa:4096 -days 825 -subj /CN={{ ctfd_domain }}
    -addext "subjectAltName=DNS:{{ ctfd_domain }}"
    -keyout /etc/nginx/certs/ctfd.key -out /etc/nginx/certs/ctfd.crt
  args:
    creates: /etc/nginx/certs/ctfd.crt
  notify: Recharger nginx

- name: Site nginx (HTTP -> HTTPS, reverse proxy vers gunicorn)
  ansible.builtin.template:
    src: nginx-ctfd.j2
    dest: /etc/nginx/sites-available/ctfd
    mode: "0644"
  notify: Recharger nginx

- name: Site activé
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ctfd
    dest: /etc/nginx/sites-enabled/ctfd
    state: link
  notify: Recharger nginx

- name: Site par défaut retiré
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

# --- Docker et challenges ---------------------------------------------------
- name: Démon Docker (ports des instances publiés sur l'IP NetBird, logs bornés)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "ip": "{{ vm_vpn_ip }}",
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
  notify: Redémarrer docker

- name: Dépôt des challenges
  ansible.builtin.git:
    repo: "{{ challenges_repo }}"
    dest: "{{ challenges_dir }}"
    version: main
    force: false
  register: challenges_git

- name: Fichiers challenge.env (flags rotés, depuis secrets.yml)
  ansible.builtin.copy:
    dest: "{{ challenges_dir }}/challenges/{{ item.key }}/setup/challenge.env"
    content: "{{ item.value }}"
    mode: "0600"
  loop: "{{ challenge_env | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Images des challenges (relancées par le plugin, jamais reconstruites par CTFd)
  community.docker.docker_image_build:
    name: "{{ item.tag.split(':')[0] }}"
    tag: "{{ item.tag.split(':')[1] }}"
    path: "{{ challenges_dir }}/challenges/{{ item.dir }}"
    rebuild: "{{ 'always' if challenges_git.changed else 'never' }}"
  # Builds longs : sshd coupe les sessions inactives après 5 min (ClientAliveCountMax 0).
  async: 3600
  poll: 20
  loop: "{{ challenge_images }}"
  loop_control:
    label: "{{ item.tag }}"

- name: cAdvisor (métriques des conteneurs pour Prometheus)
  community.docker.docker_container:
    name: cadvisor
    image: "{{ cadvisor_image }}"
    restart_policy: unless-stopped
    published_ports: ["{{ vm_vpn_ip }}:8080:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

# --- Supervision et durcissement ---------------------------------------------
- name: node_exporter
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    content: 'ARGS="--web.listen-address=0.0.0.0:9100"'
  notify: Redémarrer node_exporter

- name: Pare-feu (liste blanche, accès via NetBird ; chaînes Docker et NETBIRD-* ajoutées par les démons)
  ansible.builtin.template:
    src: rules.v4.j2
    dest: /etc/iptables/rules.v4
    mode: "0640"
  notify: Recharger le pare-feu

- name: Paramètres noyau (CIS, routage Docker)
  ansible.builtin.copy:
    src: sysctl/
    dest: /etc/sysctl.d/
    mode: "0644"
  notify: Recharger sysctl

- name: Filtre fail2ban CTFd (échecs de connexion)
  ansible.builtin.copy:
    src: fail2ban-ctfd.conf
    dest: /etc/fail2ban/filter.d/ctfd.conf
    mode: "0644"
  notify: Redémarrer fail2ban

- name: Jails fail2ban (sshd, ctfd, mysqld-auth, recidive)
  ansible.builtin.copy:
    src: fail2ban-jails.conf
    dest: /etc/fail2ban/jail.d/rootmeup.conf
    mode: "0644"
  notify: Redémarrer fail2ban

- name: Règles auditd (CIS)
  ansible.builtin.copy:
    src: "audit/{{ item }}"
    dest: "/etc/audit/rules.d/{{ item }}"
    mode: "0640"
  loop: [50-cis.rules, audit.rules]
  notify: Recharger auditd

- name: Politique de mots de passe
  ansible.builtin.copy:
    src: pwquality.conf
    dest: /etc/security/pwquality.conf
    mode: "0644"

- name: Journalisation de sudo (CIS)
  ansible.builtin.copy:
    src: sudoers-00-cis
    dest: /etc/sudoers.d/00-cis
    mode: "0440"
    validate: visudo -cf %s

- name: Bannière légale SSH
  ansible.builtin.copy:
    src: issue.net
    dest: /etc/issue.net
    mode: "0644"

- name: Services de sécurité actifs
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [fail2ban, auditd]
