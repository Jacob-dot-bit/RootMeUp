# Version de CTFd déployée (tag git de https://github.com/CTFd/CTFd).
# À relever sur la VM en place : sudo git -C /opt/CTFd describe --tags
ctfd_version: ""
ctfd_dir: /opt/CTFd
ctfd_plugin_repo: https://github.com/Bigyls/CTFdDockerContainersPlugin.git
ctfd_plugin_version: master
ctfd_domain: ctf-rootmeup.tail8588a8.ts.net

challenges_repo: https://github.com/Jacob-dot-bit/RootMeUp.git
challenges_dir: /srv/ctf-challenges/RootMeUp

# Images construites sur la VM (dossier challenges/<dir>, tag attendu par CTFd).
challenge_images:
  - { dir: 1-Blue-Team-Phishing-ELK-Sarah,           tag: rootmeup/bt1-phishing-elk:1.0 }
  - { dir: 2-Blue-Team-Memory-Forensics-Jakub,       tag: rootmeup/bt2-memory-forensics:1.0 }
  - { dir: 3-Blue-Team-Hardening-Lucas,              tag: rootmeup/bt3-hardening:1.1 }
  - { dir: 1-Red-Team-Binary-Vault-Jakub,            tag: rootmeup/rt1-binary-vault:1.0 }
  - { dir: 2-Red-Team-Operation-Silent-Ledger-Lucas, tag: rootmeup/rt2-silent-ledger:1.1 }
  - { dir: 3-Red-Team-Nexus-Cipher-Sarah,            tag: rootmeup/rt3-ciphers-nexus:1.0 }
  - { dir: 4-Red-Team-breach-and-ascend,             tag: rt4-beach-and-ascend:1.3 }

ssh_allowed_users: [sjoyas, lucas, jakub, evan]

# Clé publique du compte `tunnel` (tunnel MySQL ouvert par la VM Grafana).
tunnel_public_key: ""

cadvisor_image: gcr.io/cadvisor/cadvisor:v0.49.1

# Restauration des données : dossier local produit par infra/vms/backup-data.sh.
# Vide = installation à blanc (CTFd affichera /setup).
ctfd_restore_from: ""
