[DEFAULT]
maxretry = 3
findtime = 10m
bantime  = 1d
ignoreip = 127.0.0.1/8 ::1
backend  = systemd

[sshd]
enabled = true
port    = 22
filter  = sshd

[grafana]
enabled  = true
port     = 3000
filter   = grafana
backend  = systemd

[recidive]
enabled  = true
filter   = recidive
logpath  = /var/log/fail2ban.log
banaction = iptables-allports
findtime = 1d
maxretry = 2
bantime  = -1
