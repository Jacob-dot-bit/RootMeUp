- name: Clé du dépôt Tailscale
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Dépôt Tailscale
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main

- name: Paquet tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: État de connexion Tailscale
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Connexion au tailnet
  ansible.builtin.command: >-
    tailscale up --authkey={{ tailscale_authkey }} --hostname={{ pve_hostname }}
    {{ '--ssh' if tailscale_ssh else '' }}
  no_log: true
  when: (ts_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
