# Les chaînes NETBIRD-* sont gérées par le démon netbird : elles ne figurent pas dans
# les modèles et sont recréées à son redémarrage (handler).
- name: Règles iptables persistantes
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/iptables/{{ item }}"
    mode: "0640"
    backup: true
  loop: [rules.v4, rules.v6]
  notify:
    - Recharger le pare-feu
    - Redémarrer netbird
