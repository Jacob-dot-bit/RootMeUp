# Copier en secrets.yml (non versionné), remplir, puis chiffrer :
#   ansible-vault encrypt secrets.yml
#
# Clé d'authentification Tailscale (admin console > Settings > Keys), à usage unique.
tailscale_authkey: "tskey-auth-CHANGEME"

# Mots de passe initiaux des comptes Proxmox (realm pve). À changer à la première connexion.
pve_user_passwords:
  evan@pve: "CHANGEME"
  lucas@pve: "CHANGEME"
  sarah@pve: "CHANGEME"

# --- VM Grafana ---
# [security] secret_key de grafana.ini (chiffre les secrets stockés dans grafana.db : la
# garder identique à l'ancienne valeur pour qu'une base restaurée reste lisible).
grafana_secret_key: "CHANGEME"
discord_webhook_ctf: "https://discord.com/api/webhooks/CHANGEME"
discord_webhook_proxmox: "https://discord.com/api/webhooks/CHANGEME"
healthchecks_ping_url: "https://hc-ping.com/CHANGEME"
# Clé privée du compte `tunnel` de la VM CTF (tunnel MySQL pour Grafana).
grafana_tunnel_private_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  CHANGEME
  -----END OPENSSH PRIVATE KEY-----

# --- VM CTFd ---
ctfd_db_password: "CHANGEME"
# SECRET_KEY de /etc/ctfd/ctfd.env sur l'ancienne VM (garder la même valeur pour conserver les sessions).
ctfd_secret_key: "CHANGEME"
# Flags rotés : contenu du setup/challenge.env de chaque challenge concerné.
challenge_env:
  1-Red-Team-Binary-Vault-Jakub: |
    CHANGEME
  2-Blue-Team-Memory-Forensics-Jakub: |
    CHANGEME
