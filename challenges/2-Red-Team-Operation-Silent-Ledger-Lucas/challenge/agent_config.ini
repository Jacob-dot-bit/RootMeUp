[fleet-agent]
node_id            = app-01
orchestrator_socket = /run/meridian/orchestrator.sock
protocol           = JSON ligne-par-ligne ; les commandes privilegiees
                     exigent un champ "token"

; Token d'API utilise par l'agent pour piloter l'orchestrateur.
; (stocke en clair localement -- mauvaise pratique classique)
api_token          = 8f3ac1e9b7d24f0aa6c9e21d4b7f9931

; Rappel interne : l'endpoint "restore_config" accepte un blob serialise.
; NOTE(IT): penser a migrer vers un format signe un jour...

flag: RootMeUp{ag3nt_t0k3n_l00t3d_5c2d71}
